name: Verify and release crop edition
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-desktop.txt
      - run: python -m unittest discover -s tests -v
      - run: python desktop.py --self-test outputs/self-test.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install chromium
      - run: node scripts/verify_ui_pages.cjs
        env:
          UI_TEST_BROWSER: chromium
      - uses: actions/upload-artifact@v4
        with:
          name: UI-verification
          path: outputs/ui-pages/*.json
      - run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: InstaCrop-Windows
          path: release/InstaCrop-Windows-1.0.3.*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: InstaCrop-Windows
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" release/* --title "InstaCrop $RELEASE_TAG" --notes "图片库、扫描裁剪与照片调整分为独立页面；支持素材分类、来源筛选与批量移除。导入类型随页面确定，导出及批量参数只作用于当前筛选结果。"
          fi
