name: Verify and release crop edition
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-desktop.txt
      - run: python -m unittest discover -s tests -v
      - run: python desktop.py --self-test outputs/self-test.json
      - run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: InstaCrop-Windows
          path: release/InstaCrop-Windows-1.0.0.*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: InstaCrop-Windows
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" release/* --title "InstaCrop $RELEASE_TAG" --notes "独立扫描裁剪版：自动识别、四角校正、精细收边、批量导出。已移除 Live 制作与视频工具。"
          fi
